<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>Alfred</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<!--
  Alfred — the rewired app (docs/rewire/SPEC.md, MOCK.md).
  One page for phone, iPad and desktop. Everything the old desk (home.html) did lives here now:
  the four tabs read /api/v2/*, and the pages behind the You menu (settings, your model, coach notes,
  weekly review, archive, conversations) use the existing endpoints. First-run setup is setup.html.
-->
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#1F1E1B; --ink2:#2E2C28; --body:#4A4740; --quiet:#6B675F; --faint:#8A857B;
  --hair:#E4DFD5; --hair2:#EEEAE2; --hair3:#F0ECE4; --line:#D9D4C9; --chip:#ECEAE2; --avatar:#E8E4DA; --sunk:#FAF8F4;
  --border:#E6E1D7; --dashed:#D3CDC1; --check:#B9B3A7;
  --warm:#C9823F; --warmtext:#9A5A22; --warmbg:#F5EBDD;
  --accent:#4E6B5A; --accent-soft:rgba(78,107,90,.10); --accent-line:rgba(78,107,90,.22); --on-accent:#FFFFFF;
  --shadow:0 1px 1px rgba(31,30,27,.04), 0 4px 14px rgba(31,30,27,.06);
  --serif:"Newsreader", Georgia, serif; --sans:"Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1A1917; --card:#23221F; --ink:#EDEAE3; --ink2:#DAD6CD; --body:#C4BFB4; --quiet:#A39E93; --faint:#8C877C;
  --hair:#34322D; --hair2:#2E2C28; --hair3:#2E2C28; --line:#3E3B35; --chip:#2E2C28; --avatar:#34322D; --sunk:#1E1D1A;
  --border:#34322D; --dashed:#4A463F; --check:#6B675F;
  --warm:#D9954F; --warmtext:#E0A564; --warmbg:#33281C;
  --accent:#7FA08B; --accent-soft:rgba(127,160,139,.14); --accent-line:rgba(127,160,139,.28); --on-accent:#14130F;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#1A1917; --card:#23221F; --ink:#EDEAE3; --ink2:#DAD6CD; --body:#C4BFB4; --quiet:#A39E93; --faint:#8C877C;
  --hair:#34322D; --hair2:#2E2C28; --hair3:#2E2C28; --line:#3E3B35; --chip:#2E2C28; --avatar:#34322D; --sunk:#1E1D1A;
  --border:#34322D; --dashed:#4A463F; --check:#6B675F;
  --warm:#D9954F; --warmtext:#E0A564; --warmbg:#33281C;
  --accent:#7FA08B; --accent-soft:rgba(127,160,139,.14); --accent-line:rgba(127,160,139,.28); --on-accent:#14130F;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
textarea,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

/* ── frame ── */
.app{display:flex;justify-content:center;min-height:100dvh}
.rail{display:none}
.main{flex:1 1 auto;min-width:0;max-width:640px;padding:14px 20px 140px}
.aside{display:none}
.topbar{display:flex;align-items:center;gap:12px;height:48px}
.me{position:relative;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;padding:0;flex:0 0 auto}
.dot{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:5px;background:var(--warm);border:2px solid var(--paper)}
.date{font-size:14px;color:var(--quiet)}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:30}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--faint);padding:0;min-height:52px}
.tab.on{color:var(--ink);font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(31,30,27,.18);z-index:31}

@media (min-width: 900px){
  .app{gap:0}
  .rail{display:flex;flex-direction:column;gap:4px;flex:0 0 232px;height:100dvh;position:sticky;top:0;padding:22px 16px}
  .main{max-width:640px;border-left:1px solid var(--hair);border-right:1px solid var(--hair);padding:18px 32px 60px;min-height:100dvh}
  .tabbar,.fab,.topbar .me{display:none}
  .more-toggle{display:none!important}
  .more-list{display:flex!important}
  .more-wide{display:block!important}
}
@media (min-width: 1180px){
  .aside{display:flex;flex-direction:column;gap:16px;flex:0 0 380px;height:100dvh;position:sticky;top:0;overflow-y:auto;padding:22px 24px}
}
.wordmark{font-family:var(--serif);font-size:28px;padding:4px 14px 22px}
.railtab{height:52px;border:none;border-radius:26px;background:none;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:17px;color:var(--faint);text-align:left}
.railtab.on{background:var(--chip);color:var(--ink);font-weight:600}
.railadd{margin-top:16px;height:50px;border:none;border-radius:25px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 6px rgba(31,30,27,.18)}
.railme{margin-top:auto;border:none;border-radius:30px;background:none;display:flex;align-items:center;gap:12px;padding:8px 10px;text-align:left}
.railme .me{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:21px}
.railme small{display:block;font-size:12px;color:var(--warmtext)}

/* ── type & sections ── */
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:30px}
.label{font-size:13px;color:var(--quiet)}
.section{margin-top:24px}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.stack.tight{gap:8px}
.empty{padding:14px 0;font-size:14px;color:var(--quiet)}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
.card.press:active{transform:scale(.985);box-shadow:0 1px 2px rgba(31,30,27,.06)}
.card.dashed{border-style:dashed;border-color:var(--dashed)}
.card.sel{border-color:var(--accent)}
.post{padding:14px 18px 8px}
.who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:14px;line-height:1.3}
.who b{font-weight:600}
.meta{margin-top:2px;font-size:13px;color:var(--quiet);display:flex;align-items:center;gap:6px}
.meta.urgent{color:var(--warmtext)}
.wdot{width:6px;height:6px;border-radius:3px;background:var(--warm);display:inline-block;flex:0 0 auto}
.body{margin-top:8px;font-size:17px;line-height:1.4;font-weight:500}
.actions{margin-top:10px;padding-top:6px;border-top:1px solid var(--hair3);display:flex;align-items:center;gap:4px}
.btn{height:36px;padding:0 18px;border-radius:18px;border:none;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 1px 2px rgba(31,30,27,.18)}
.btn.outline{background:var(--card);color:var(--accent);border:1px solid var(--accent);box-shadow:0 1px 2px rgba(31,30,27,.08)}
.btn.plain{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:400}
.btn.big{height:46px;border-radius:23px;font-size:15px}
.ghost{height:40px;padding:0 10px;border:none;background:none;color:var(--quiet);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.link{height:36px;padding:0;border:none;background:none;color:var(--accent);font-size:14px;font-weight:600}
.icon{width:40px;height:40px;border:none;background:none;color:var(--faint);padding:0;display:inline-flex;align-items:center;justify-content:center}
.spacer{flex:1 1 auto}
.compose{margin-top:12px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.compose textarea{margin-top:6px;width:100%;border:none;resize:none;outline:none;background:transparent;font-size:15px;line-height:1.45}

.upnext{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:20px;padding:16px 18px 12px;box-shadow:var(--shadow)}
.upnext.pinned{background:var(--card);border:1.5px solid var(--accent)}
.upnext .head{display:flex;align-items:center;gap:8px;font-size:13px}
.amark{width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px}
.upnext p{margin:10px 0 0;font-family:var(--serif);font-size:24px;line-height:1.28}
.upnext .actions{border-top-color:var(--accent-line)}

.row{padding:8px 14px 8px 4px;display:flex;align-items:center;gap:6px}
.check{flex:0 0 auto;width:44px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.check span{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--check);background:var(--sunk);box-shadow:inset 0 1px 2px rgba(31,30,27,.08)}
.check:hover span{border-color:var(--accent)}
.rowmain{flex:1 1 auto;min-width:0;padding:4px 0;border:none;background:none;text-align:left}
.rowmain .who{font-size:13px}
.rowmain .t{margin-top:2px;font-size:15px;line-height:1.38}
.due{flex:0 0 auto;font-size:12px;color:var(--quiet);padding-right:2px}
.due.today{color:var(--warmtext)}

.more-toggle{margin-top:8px;width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;border:none;border-bottom:1px solid var(--hair);background:none;padding:0;color:var(--quiet);font-size:15px;text-align:left}
.more-list{display:none;flex-direction:column;gap:8px;padding-top:10px}
.more-list.open{display:flex}

.coach{margin-top:22px;background:var(--chip);border-radius:16px;padding:16px 16px 12px}
.coach .x{width:36px;height:36px;margin:-8px -8px 0 0;border:none;background:none;color:var(--quiet);padding:0}

.chips{margin-top:14px;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
@media (min-width: 900px){ .chips{flex-wrap:wrap} }
.chipbtn{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chipbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{height:32px;padding:0 12px;border-radius:16px;background:var(--chip);display:inline-flex;align-items:center;font-size:13px}

.ent{width:100%;display:flex;gap:12px;text-align:left;padding:14px 16px 8px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.avatar{flex:0 0 auto;width:42px;height:42px;border-radius:21px;background:var(--avatar);color:var(--body);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.ent .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ent .name{font-family:var(--serif);font-size:20px;line-height:1.2}
.ent .pname{font-size:15px;font-weight:600}
.ent .small{flex:0 0 auto;font-size:12px;color:var(--quiet)}
.pulse{margin-top:4px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--quiet)}
.pdot{width:7px;height:7px;border-radius:4px;display:inline-block;background:var(--accent)}
.pdot.stalled{background:var(--warm)}
.ent .line{margin-top:8px;display:block;font-size:15px;line-height:1.4;color:var(--ink2)}
.dismissbtn{flex:0 0 auto;width:44px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--quiet)}
.dismissbtn:hover{color:var(--ink)}
.pinbtn{flex:0 0 auto;width:44px;height:44px;margin:-6px -8px 0 0;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--quiet)}
.pinbtn.on{color:var(--accent)}
.pinbtn:hover{color:var(--ink)}
.foot{margin-top:10px;padding:8px 0 4px;border-top:1px solid var(--hair3);display:flex;gap:18px;font-size:13px;color:var(--quiet)}
.foot span{display:inline-flex;align-items:center;gap:5px}

/* ── aside ── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px 8px}
.panel h2{margin:0;font-family:var(--serif);font-weight:400;font-size:21px}
.aglist button{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;border:none;border-top:1px solid var(--hair3);background:none;padding:11px 0}
.aglist .tm{flex:0 0 48px;font-size:13px;color:var(--quiet);padding-top:1px}
.aglist .ev{flex:1 1 auto;min-width:0;border-left:2px solid var(--line);padding-left:10px}
.aglist .ev.owed{border-left-color:var(--accent)}
.aglist .ev b{display:block;font-size:15px;font-weight:500}
.aglist .ev small{display:block;margin-top:2px;font-size:13px;color:var(--quiet)}

/* ── sheets ── */
.scrim{position:fixed;inset:0;background:rgba(31,30,27,.28);z-index:40;border:none;padding:0;cursor:default}
.sheet{position:fixed;z-index:41;background:var(--paper);overflow-y:auto;padding:10px 24px 34px;box-shadow:0 -8px 30px rgba(31,30,27,.12)}
.sheet.m-sheet{left:0;right:0;bottom:0;max-height:90dvh;border-radius:22px 22px 0 0;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.sheet.m-side{top:0;right:0;bottom:0;width:420px;border-left:1px solid var(--hair);box-shadow:-8px 0 24px rgba(31,30,27,.08)}
.sheet.m-dialog{top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:86dvh;border-radius:22px;box-shadow:0 20px 60px rgba(31,30,27,.22)}
.grab{display:flex;justify-content:center;padding-bottom:6px}
.grab span{width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheet .close{display:flex;justify-content:flex-end;margin-bottom:-18px}
.sheet .close button{height:40px;padding:0 4px;border:none;background:none;color:var(--quiet);font-size:14px}
.field{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);font-size:16px;line-height:1.45;outline:none;box-shadow:inset 0 1px 2px rgba(31,30,27,.06)}
textarea.field{resize:none}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair2)}
.sub{margin-top:22px;font-size:13px;color:var(--quiet);padding-bottom:6px;border-bottom:1px solid var(--hair)}
.menuitem{width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;border:none;border-bottom:1px solid var(--hair2);background:none;padding:0;font-size:16px;text-align:left}
.menuitem small{font-size:13px;color:var(--quiet)}
.issue{margin-top:14px;width:100%;text-align:left;border:none;border-radius:14px;background:var(--warmbg);padding:14px 16px}
.decision{margin-top:18px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:16px}
.bubble{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.bubble.me{background:var(--chip);margin-left:40px}
.bubble.al{background:var(--card);border:1px solid var(--border);margin-right:20px}

/* ── settings rows, switches ── */
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--hair2)}
.srow:last-child{border-bottom:none}
.srow.col{flex-direction:column;align-items:stretch;gap:2px}
.field.mini{margin-top:4px;padding:8px 10px;font-size:14px;border-radius:10px}
.srow > .field.mini, .srow select.field.mini{width:auto;flex:0 0 auto}
.switch{flex:0 0 auto;width:44px;height:26px;border-radius:13px;border:none;background:var(--line);padding:3px;display:inline-flex;align-items:center;transition:background .15s}
.switch span{width:20px;height:20px;border-radius:10px;background:var(--card);box-shadow:0 1px 2px rgba(31,30,27,.25);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on span{transform:translateX(18px)}
.code{background:var(--sunk);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:13px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto}

/* ── toast ── */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--paper);border-radius:14px;padding:0 8px 0 16px;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(31,30,27,.2)}
@media (min-width: 900px){ .toast{bottom:28px} }
.toast button{height:40px;padding:0 12px;border:none;background:none;color:var(--paper);opacity:.85;font-size:14px;font-weight:600}

/* ── login ── */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:min(360px,100%)}
.loading{padding:40px 0;color:var(--quiet);font-size:15px}
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form class="box" onsubmit="login(event)">
    <div class="serif" style="font-size:40px">Alfred</div>
    <label for="pass" class="label" style="display:block;margin-top:20px">Passcode</label>
    <input id="pass" class="field" type="password" autocomplete="current-password" autofocus>
    <div id="loginErr" class="label" style="color:var(--warmtext);margin-top:8px;min-height:18px"></div>
    <button class="btn big" style="width:100%;margin-top:6px" type="submit">Open</button>
  </form>
</div>

<div id="app" class="app hidden">
  <nav class="rail" aria-label="Main">
    <div class="wordmark">Alfred</div>
    <div id="railTabs"></div>
    <button class="railadd" type="button" onclick="openAdd()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    <button class="railme" type="button" onclick="openYou()">
      <span class="me">M<span id="railDot" class="dot hidden"></span></span>
      <span><span id="railName" style="display:block;font-size:15px;font-weight:600">You</span><small id="railIssue"></small></span>
    </button>
  </nav>

  <main class="main" id="main">
    <div class="topbar">
      <button class="me" type="button" aria-label="Open the You menu" onclick="openYou()"><span id="meInitial">M</span><span id="meDot" class="dot hidden"></span></button>
      <span class="date" id="dateLabel"></span>
    </div>
    <div id="view"><div class="loading">Loading…</div></div>
  </main>

  <aside class="aside" aria-label="Today" id="aside"></aside>
</div>

<nav class="tabbar hidden" id="tabbar" aria-label="Main"></nav>
<button class="fab hidden" id="fab" type="button" aria-label="Add a to-do, ask, or schedule" onclick="openAdd()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// state
// ═══════════════════════════════════════════════════════════════════════
const TOKEN_KEY = 'alfred_auth_token', EXPIRES_KEY = 'alfred_auth_expires';
const S = {
  tab: 'now', token: null, me: '',
  now: null, todos: null, fronts: null, people: null, status: null,
  filter: 'all', pfilter: 'all', addPerson: false, addPersonName: '', showMore: false, replyId: null,
  sheet: null,           // { kind, id, data }
  showLog: false,
  chat: [], chatSession: null,
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lowerFirst = s => !s ? s : (/^[A-Z]{2}/.test(s) ? s : s[0].toLowerCase() + s.slice(1));
const firstName = n => String(n || '').split(' ')[0];
const isWide = () => window.matchMedia('(min-width: 900px)').matches;

// ═══════════════════════════════════════════════════════════════════════
// auth
// ═══════════════════════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Authorization': 'Bearer ' + S.token }, opts.headers || {});
  if (opts.json) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(); throw new Error('unauthorized'); }
  return r.json();
}
const post = (path, json) => api(path, { method: 'POST', json: json || {} });

async function boot() {
  try {
    const st = await (await fetch('/api/setup/status')).json();
    if (st && st.isComplete === false) { location.href = '/setup.html' + location.search; return; }
  } catch (e) {}
  // The Mac launcher opens "/?passcode=…": sign in with it once, then take it out of the address bar.
  const qp = new URLSearchParams(location.search);
  const urlPass = qp.get('passcode');
  if (urlPass) {
    qp.delete('passcode');
    history.replaceState(null, '', location.pathname + (qp.toString() ? '?' + qp : '') + location.hash);
    try {
      const r = await (await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: urlPass }) })).json();
      if (r.success && r.token) { localStorage.setItem(TOKEN_KEY, r.token); localStorage.setItem(EXPIRES_KEY, r.expiresAt || ''); }
    } catch (e) {}
  }
  const t = localStorage.getItem(TOKEN_KEY), exp = localStorage.getItem(EXPIRES_KEY);
  if (!t || (exp && new Date(exp) <= new Date())) return showLogin();
  try {
    const v = await (await fetch('/api/auth/validate', { headers: { 'Authorization': 'Bearer ' + t } })).json();
    if (!v.valid) return showLogin();
  } catch (e) {}
  S.token = t; start();
}
function showLogin() { document.getElementById('login').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); ['tabbar','fab'].forEach(id => document.getElementById(id).classList.add('hidden')); }
async function login(e) {
  e.preventDefault();
  const passcode = document.getElementById('pass').value;
  const r = await (await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode }) })).json().catch(() => ({}));
  if (r.success && r.token) { localStorage.setItem(TOKEN_KEY, r.token); localStorage.setItem(EXPIRES_KEY, r.expiresAt || ''); S.token = r.token; start(); }
  else document.getElementById('loginErr').textContent = r.error || 'That passcode did not work.';
}
function start() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  ['tabbar','fab'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  applyTheme();
  const want = (location.hash || '').replace('#', '');
  if (['now','todos','fronts','people'].includes(want)) S.tab = want;
  renderNav(); go(S.tab); loadStatus();
  if (PAGE_TITLES[want]) openPage(want);
  if (want === 'wa') openWa();
  // A notification that lands on an already-open window arrives as a hash change (sw.js calls
  // client.navigate), and so does the back button. Both are same-document navigations, so without
  // this the URL changes and the screen does not. go() uses replaceState, which fires no event here.
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#', '');
    if (!h) return;
    if (PAGE_TITLES[h]) { if (S.page !== h) openPage(h); return; }
    if (h === 'wa') { openWa(); return; }
    if (['now','todos','fronts','people'].includes(h) && (S.tab !== h || S.page)) go(h);
  });
  const action = new URLSearchParams(location.search).get('notify_action');
  setTimeout(() => checkCapture(action === 'post-meeting'), action === 'post-meeting' ? 500 : 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(() => checkCapture(false), 500); });
  setInterval(() => { if (!document.hidden && !S.sheet && !S.addPerson) refresh(); }, 120000);
  setInterval(loadStatus, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  if (new URLSearchParams(location.search).get('open') === 'prep') setTimeout(openPrep, 900);
  // Push notifications are delivered through the service worker; subscribing stays in settings.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=2.4.0', { updateViaCache: 'none' }).catch(() => {});
}

function applyTheme() { const t = localStorage.getItem('alfred_theme'); if (t) document.documentElement.setAttribute('data-theme', t); }
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next); localStorage.setItem('alfred_theme', next);
}

const icon = (k, s = 17, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const TABS = [['now','Now'],['todos','To-dos'],['fronts','Fronts'],['people','People']];
function renderNav() {
  document.getElementById('tabbar').innerHTML = TABS.map(([k, l]) => `<button type="button" class="tab ${S.tab===k&&!S.page?'on':''}" ${S.tab===k&&!S.page?'aria-current="page"':''} onclick="go('${k}')">${icon(k, 22, 1.7)}<span>${l}</span></button>`).join('');
  document.getElementById('railTabs').innerHTML = TABS.map(([k, l]) => `<button type="button" class="railtab ${S.tab===k&&!S.page?'on':''}" ${S.tab===k&&!S.page?'aria-current="page"':''} onclick="go('${k}')">${icon(k, 24, 1.7)}<span>${l}</span></button>`).join('');
}
function go(tab) {
  S.page = null; S.tab = tab; S.replyId = null; history.replaceState(null, '', '#' + tab);
  if (tab === 'people') loadSched();
  if (tab === 'todos') loadClosures();
  renderNav(); renderView(); load(tab);
  if (tab !== 'now' && !S.now) load('now');   // the aside reads the now payload
  window.scrollTo(0, 0);
}
async function load(tab) {
  try {
    if (tab === 'now') { S.now = await api('/api/v2/now'); if (S.now.user_first_name) { S.me = S.now.user_first_name; document.getElementById('railName').textContent = S.me; document.getElementById('meInitial').textContent = S.me[0]; document.querySelector('.railme .me').firstChild.textContent = S.me[0]; } }
    if (tab === 'todos') S.todos = await api('/api/v2/todos?filter=' + encodeURIComponent(S.filter));
    if (tab === 'fronts') S.fronts = await api('/api/v2/fronts');
    if (tab === 'people') S.people = await api('/api/v2/people');
  } catch (e) { if (e.message !== 'unauthorized') console.error(e); }
  if (tab === S.tab) renderView();
  renderAside();
}
function refresh() { load(S.tab); if (S.tab !== 'now') load('now'); }
async function loadStatus() {
  try { S.status = await api('/api/v2/status'); } catch (e) { return; }
  const issues = (S.status && S.status.issues) || [];
  ['meDot','railDot'].forEach(id => document.getElementById(id).classList.toggle('hidden', !issues.length));
  document.getElementById('railIssue').textContent = issues.length ? issues[0].title : '';

function renderView() {
  const el = document.getElementById('view');
  if (S.page) { el.innerHTML = viewPage(); return; }
  document.getElementById('dateLabel').textContent = (S.now && S.now.date_label) || '';
  if (S.tab === 'now') el.innerHTML = S.now ? viewNow() : '<div class="loading">Loading…</div>';
  if (S.tab === 'todos') el.innerHTML = S.todos ? viewTodos() : '<div class="loading">Loading…</div>';
  if (S.tab === 'fronts') el.innerHTML = S.fronts ? viewFronts() : '<div class="loading">Loading…</div>';
  if (S.tab === 'people') el.innerHTML = S.people ? viewPeople() : '<div class="loading">Loading…</div>';
  // A background refresh (every two minutes, and on every visibilitychange) rebuilds this view
  // wholesale, which would otherwise throw away a half-typed name and the caret with it.
  if (S.tab === 'people' && S.addPerson) restoreAddPerson();
}

// ── a to-do as a post-style card (now tab) ──
function whoLine(t) {

}
function primaryLabel(t) { return t.action === 'reply' ? 'Reply' : (t.action === 'decide' ? 'Decide' : 'Done'); }
function postCard(t) {

  const compose = S.replyId === t.id ? `<div class="compose"><div class="label" style="font-size:12px">To ${esc(firstName(t.person))} · WhatsApp</div>

      <div style="margin-top:6px;display:flex;gap:6px"><button type="button" class="btn" onclick="sendReply('${esc(t.id)}')">Send</button><button type="button" class="ghost" onclick="S.replyId=null;renderView()">Cancel</button></div></div>` : '';
  return `<article class="card press post">
    ${whoLine(t)}
    <div class="meta ${t.urgent?'urgent':''}">${t.urgent?'<span class="wdot"></span>':''}${esc(meta)}</div>

    <div class="actions">

function rowCard(t) {
  const due = t.snoozed_until && t.bucket === 'upcoming' ? dayLabel(t.snoozed_until) : (t.due ? dayLabel(t.due) : '');
  const isToday = t.due && t.due <= todayISO();

      ${who ? `<div class="who"><b>${esc(who)}</b> <span style="color:var(--quiet)">${esc(sub)}</span></div>` : ''}
      <div class="t">${esc(t.title)}</div>

}

function viewNow() {
  const n = S.now; let h = '';
  // Up next: the pinned to-do wins; otherwise Alfred's line for this moment.
  if (n.pinned) {
    const p = n.pinned;
    h += `<article class="upnext pinned"><div class="head" style="color:var(--accent)">${icon('pin',15)}<b>Pinned by you</b><span class="spacer"></span><button type="button" class="ghost" style="height:32px" onclick="pin(null)">Unpin</button></div>
      <div class="label" style="margin-top:6px">${esc(p.person || p.front_name || '')} ${p.person && p.front_name ? '· ' + esc(p.front_name) : ''}</div>
      <p style="margin-top:4px">${esc(p.title)}</p>
      <div class="actions" style="border-top-color:var(--hair3)"><button type="button" class="btn" onclick="primary('${esc(p.id)}')">${primaryLabel(p)}</button></div></article>`;
    if (S.replyId === p.id) h += postCard(p);
  } else if (n.up_next && n.up_next.text) {
    const u = n.up_next;
    h += `<article class="upnext"><div class="head"><span class="amark" aria-hidden="true">A</span><b>Alfred</b><span style="color:var(--body)">· up next</span><span class="spacer"></span><span style="color:var(--body)">${esc(u.time || '')}</span></div>
      <p>${esc(u.text)}</p>

  }

    h += `<div class="label" style="margin-top:22px">Top of your list</div><div class="stack">${n.top.map(postCard).join('')}</div>`;
  } else if (!n.pinned) {
    const next = (n.agenda || [])[0];
    h += `<div style="margin-top:22px;padding:26px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)"><div class="serif" style="font-size:22px">You are clear.</div>
      <div style="margin-top:6px;font-size:15px;color:var(--quiet)">${next ? 'Next up is ' + esc(next.title) + ' at ' + esc(next.time) + '.' : 'Nothing is waiting on you.'}</div></div>`;
  }
  if ((n.more || []).length) {
    h += `<button type="button" class="more-toggle" onclick="S.showMore=!S.showMore;renderView()"><span>${n.more.length} more today</span><span style="transform:${S.showMore?'rotate(90deg)':'none'}">${icon('chev',16)}</span></button>
      <div class="label more-wide" style="display:none;margin-top:22px">Also today</div>
      <div class="more-list ${S.showMore?'open':''}">${n.more.map(rowCard).join('')}</div>`;
  }
  if (n.suggested_count) {
    h += `<button type="button" class="ghost" style="margin-top:10px;padding:0" onclick="go('todos')">${n.suggested_count} suggested to-do${n.suggested_count===1?'':'s'} waiting for you ${icon('chev',14)}</button>`;
  }
  if (n.coach) {
    const c = n.coach;
    h += `<div class="coach"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div class="label" style="font-size:12px">Alfred noticed</div>
      <div style="margin-top:4px;font-size:15px;line-height:1.45">${esc(c.text)}</div></div>
      <button type="button" class="x" aria-label="Dismiss" onclick="dismissCoach()">${icon('x',16)}</button></div>
      <button type="button" class="link" style="margin-top:6px" onclick="coachAct()">${esc(c.action_label)}</button></div>`;
  }
  return h;
}

function viewTodos() {

const PEOPLE_FILTERS = [['all','All'],['owe','Waiting on you'],['owed','Waiting on them'],['quiet','Going quiet']];
const PEOPLE_EMPTY = { all: 'Nobody on your list yet.', owe: 'Nobody is waiting on you.',
                       owed: 'You are not waiting on anyone.', quiet: 'Nobody has gone quiet.' };
function peopleMatch(p) {

function findTodo(id) {
  const pools = [];
  if (S.now) pools.push(S.now.top || [], S.now.more || [], S.now.pinned ? [S.now.pinned] : []);
  if (S.todos) pools.push(S.todos.today || [], S.todos.upcoming || [], S.todos.someday || [], S.todos.suggested || []);
  if (S.sheet && S.sheet.data) pools.push(S.sheet.data.todos || [], S.sheet.data.owe || []);
  for (const p of pools) { const t = p.find(x => x.id === id); if (t) return t; }

}

    toast(r.receipt || 'Done', undo);

}

function toolSummary(d) {
  const t = d.type || d.tool || '';
  if (t === 'calendar') return '\n' + (d.events || []).map(e => '• ' + (e.start || '') + ' ' + e.title).join('\n') + '\n';
  if (t === 'commitments') return '\n' + (d.items || []).map(i => '• ' + i.title + (i.committedTo ? ' (' + i.committedTo + ')' : '')).join('\n') + '\n';
  if (t === 'tasks' || t === 'completed_tasks') return '\n' + (d.tasks || []).map(i => '• ' + i.title).join('\n') + '\n';
  if (t === 'calendar_create') return '\n' + (d.success ? 'Booked: ' : 'Could not book: ') + (d.title || '') + ' ' + (d.timeRange || '') + '\n';
  if (t === 'task_update') return '\n' + (d.success ? 'Updated: ' : 'Could not update: ') + (d.taskTitle || '') + '\n';
  return '';
}

    <div id="chatLog">${S.chat.map(m => `<div class="bubble ${m.role==='user'?'me':'al'}">${esc(m.text)}</div>`).join('')}</div>
    <form style="margin-top:14px;display:flex;gap:8px" onsubmit="event.preventDefault();const i=document.getElementById('chatIn');const v=i.value.trim();if(v){i.value='';askAlfred(v)}">
      <input id="chatIn" class="field" style="margin-top:0" placeholder="Ask a follow-up" data-autofocus><button class="btn big" type="submit">Send</button></form>`;

async function askAlfred(q) {
  S.chat.push({ role: 'user', text: q }, { role: 'al', text: '…' }); renderSheet();
  const msg = S.chat[S.chat.length - 1];
  try {
    let url;
    if (S.chatReflect) {
      // Thinking an open question through: the self-model's reflect stream, with the turns so far.
      url = new URL('/api/self-model/reflect', location.origin);
      url.searchParams.set('facetId', S.chatReflect.id); url.searchParams.set('q', q);
      url.searchParams.set('history', JSON.stringify(S.chatReflect.history.slice(-12)));
      S.chatReflect.history.push({ role: 'user', content: q });
    } else {
      url = new URL('/api/chat/stream', location.origin); url.searchParams.set('q', q); if (S.chatSession) url.searchParams.set('sessionId', S.chatSession);
    }
    const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + S.token, 'Accept': 'text/event-stream' } });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '', ev = null, text = '';
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.replace(/\r$/, '');
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) {
          try { const d = JSON.parse(line.slice(5).trim());
            if (ev === 'chunk' || (!ev && d.text)) { text += d.text || ''; msg.text = text; const log = document.getElementById('chatLog'); if (log && log.lastElementChild) log.lastElementChild.textContent = text; }
            if (ev === 'done' && d.sessionId) S.chatSession = d.sessionId;
            if (ev === 'tool_result') { text += toolSummary(d); msg.text = text; }
            if (ev === 'error') { msg.text = d.error || d.message || 'Something went wrong.'; }
          } catch (e) {}
        }
      }
    }
    if (!text && msg.text === '…') msg.text = 'No answer came back.';
    if (S.chatReflect && text) S.chatReflect.history.push({ role: 'assistant', content: text });
  } catch (e) { msg.text = 'Could not reach Alfred.'; }
  if (S.sheet && S.sheet.kind === 'chat') renderSheet();
}

let _toastT = null;
function toast(text, undo) {
  const host = document.getElementById('toastHost');
  clearTimeout(_toastT);
  host.innerHTML = `<div class="toast" role="status"><span>${esc(text)}</span>${undo ? '<button type="button" id="undoBtn">Undo</button>' : ''}</div>`;
  if (undo) document.getElementById('undoBtn').onclick = () => { host.innerHTML = ''; undo(); };
  _toastT = setTimeout(() => host.innerHTML = '', 10000);
}
function initials(n) { return String(n || '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dayLabel(iso) {
  if (!iso) return ''; const t = todayISO();
  if (iso === t) return 'Today'; if (iso < t) return 'Overdue';
  const d = new Date(iso + 'T12:00:00'), diff = Math.round((d - new Date(t + 'T12:00:00')) / 86400000);
  if (diff === 1) return 'Tomorrow';
  if (diff < 7) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}

    let sub = await reg.pushManager.getSubscription();

async function smDo(path, msg) { const r = await apiSend(path, 'POST'); toast(r.ok === false || r.error ? (r.error || 'Could not save') : msg); await loadModel(); }
const smVerdict = (id, v) => smDo('/api/self-model/verdict?id=' + encodeURIComponent(id) + '&verdict=' + v, v === 'confirmed' ? 'Confirmed' : (v === 'dismissed' ? 'Removed' : 'Undone'));
const smDelete = id => smDo('/api/self-model/facet/delete?id=' + encodeURIComponent(id), 'Deleted');
function smRename(id) { const t = prompt('Say it in your words (leave empty to restore Alfred\'s wording)'); if (t === null) return; smDo('/api/self-model/facet/rename?id=' + encodeURIComponent(id) + '&statement=' + encodeURIComponent(t), 'Saved'); }
function smAdd(kind) { const t = document.getElementById('add-' + kind).value.trim(); if (t.length < 3) return; smDo('/api/self-model/facet/create?kind=' + kind + '&statement=' + encodeURIComponent(t), 'Added'); }
function smAnswer(id) { const t = prompt('Your answer becomes a belief'); if (!t) return; smDo('/api/self-model/resolve?id=' + encodeURIComponent(id) + '&resolution=' + encodeURIComponent(t), 'Saved as a belief'); }
const smProposal = (id, a) => smDo('/api/self-model/proposals/resolve?id=' + encodeURIComponent(id) + '&action=' + a, a === 'confirm' ? 'Linked' : 'Not linked');
const smMerge = (a, b, act) => smDo('/api/self-model/merges/resolve?a=' + encodeURIComponent(a) + '&b=' + encodeURIComponent(b) + '&action=' + act, act === 'merge' ? 'Merged' : 'Kept apart');
async function smStray(id, action) { const r = await apiSend('/api/self-model/strays/resolve', 'POST', { id, action }); toast(r.success ? (action === 'accept' ? 'Moved' : 'Kept') : (r.error || 'Could not save')); await loadModel(); }
async function openExport() {
  openSheet('export', null, null);
  let r = await api('/api/self-model/export');
  if (!r.operating_model) r = await api('/api/self-model/export?push=0', { method: 'POST' });
  S.sheet.data = r; renderSheet();
}
function sheetExport(s) {
  const d = s.data; if (!d) return '<div class="loading">Writing your operating model…</div>';
  return `<div class="serif" style="font-size:24px;padding-top:6px">Your operating model</div>
    <div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn" onclick="navigator.clipboard.writeText(S.sheet.data.operating_model||'').then(()=>toast('Copied'))">Copy</button><button type="button" class="ghost" onclick="pushExport()">Regenerate and send to Notion</button></div>
    <pre class="code" style="white-space:pre-wrap;margin-top:12px">${esc(d.operating_model || 'Nothing yet.')}</pre>`;
}
async function pushExport() { toast('Regenerating…'); const r = await api('/api/self-model/export?push=1', { method: 'POST' }); S.sheet.data = r; renderSheet(); toast(r.notion_url ? 'Sent to Notion' : 'Regenerated'); }
// "think it through": the self-model's reflect stream, in the chat sheet
function openReflect(id, text) { S.chat = [{ role: 'al', text: 'Open question: ' + text }]; S.chatReflect = { id, history: [] }; openSheet('chat'); }

// ── coach notes ──
async function loadCoach(force) {
  if (force) S.pd = {};
  await Promise.all([pget('signals', '/api/coaching/signals'), pget('cards', '/api/coaching/cards')]);
  rerenderPage();
}
function viewCoach() {
  const d = S.pd; if (!d.cards) return '<div class="loading">Alfred is writing your coach notes. This can take a minute.</div>';
  const cards = [].concat((d.signals && d.signals.signals) || [], Array.isArray(d.cards) ? d.cards : ((d.cards && d.cards.cards) || []));
  if (!cards.length) return '<div class="empty">Nothing worth saying right now.</div>';
  return `<div class="label" style="margin-top:4px">Everything your coaching skills noticed. Only the most pressing line ever reaches Now.</div><div class="stack">` +
    cards.map((c, i) => `<article class="card post"><div class="who"><b>${esc(c.label || c.type || 'Coach')}</b></div>
      <div class="body" style="font-weight:400;font-size:16px">${esc(c.insight || c.body || '')}</div>
      <div class="actions" style="flex-wrap:wrap"><button type="button" class="btn outline" onclick="coachKeep(${i})">Keep in my model</button><button type="button" class="ghost" onclick="coachAsk(${i})">Ask Alfred</button><span class="spacer"></span><button type="button" class="ghost" onclick="coachFeedback(${i},'thumbs_up')">Useful</button><button type="button" class="ghost" onclick="coachFeedback(${i},'thumbs_down')">Not useful</button></div></article>`).join('') + '</div>';
}
function coachCard(i) { const d = S.pd; return [].concat((d.signals && d.signals.signals) || [], Array.isArray(d.cards) ? d.cards : ((d.cards && d.cards.cards) || []))[i] || {}; }
async function coachKeep(i) { const c = coachCard(i); const r = await apiSend('/api/coaching/note-to-model', 'POST', { insight: c.insight || c.body, label: c.label || c.type }); toast(!r.success ? (r.error || 'Could not save') : (r.promoted === false ? 'Noted. It reads as an action, so it is kept out of your beliefs.' : 'Added to your model')); }
async function coachFeedback(i, fb) { const c = coachCard(i); await apiSend('/api/coaching/feedback', 'POST', { cardType: c.type, feedback: fb, insight: c.insight }); toast('Thanks. Alfred will weigh this.'); }
function coachAsk(i) { const c = coachCard(i); S.chat = []; S.chatReflect = null; openSheet('chat'); askAlfred('Help me act on this: ' + (c.insight || c.body || '')); }

// ── weekly review ──
async function loadWeekly() { await pget('w', '/api/weekly-reflection'); rerenderPage(); }
function viewWeekly() {
  const w = S.pd.w; if (!w) return '<div class="loading">Alfred is looking back at your week. This can take a minute.</div>';
  if (w.error) return '<div class="empty">The weekly review could not be written just now.</div>';
  const m = w.metrics || {};
  const tile = (n, l) => `<div class="card" style="flex:1 1 0;padding:14px 16px"><div class="serif" style="font-size:28px">${esc(n)}</div><div class="label">${l}</div></div>`;
  return `<div style="display:flex;gap:10px;margin-top:12px">${tile(m.tasksCompleted ?? 0, 'done')}${tile(m.tasksOverdue ?? 0, 'overdue')}${tile(Math.round((m.completionRate || 0) * (m.completionRate > 1 ? 1 : 100)) + '%', 'completion')}</div>
    <div class="card" style="margin-top:14px;padding:6px 20px 14px;line-height:1.6;font-size:16px">${mdLite(w.narrative || '')}</div>`;
}
function mdLite(s) { return esc(s).split(/\n{2,}/).map(p => /^##\s/.test(p) ? `<h3 class="serif" style="font-weight:400;font-size:21px;margin:18px 0 4px">${p.replace(/^##\s*/, '')}</h3>` : `<p>${p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</p>`).join(''); }

// ── archive ──
async function loadArchive() { await pget('a', '/api/v2/fronts/archive'); rerenderPage(); }
function viewArchive() {
  const a = S.pd.a; if (!a) return '<div class="loading">Loading…</div>';
  const rows = a.fronts || [];
  return rows.length ? `<div class="label" style="margin-top:4px">Fronts you marked done or paused. Restoring one puts it back on your fronts, within the cap of 10.</div>` +
    block('Done and paused', null, rows.map(f => srow(esc(f.name), esc((f.state === 'paused' ? 'Paused' : 'Done') + (f.date_label ? ' · ' + f.date_label : '')), `<button type="button" class="ghost" onclick="restoreFront(${ja(f.id)})">Restore</button>`)).join(''))
    : '<div class="empty">Nothing archived yet.</div>';
}
async function restoreFront(id) {
  await apiSend('/api/desk/front/restore', 'POST', { id });
  const r = await post('/api/v2/fronts/state', { id, state: 'active' });
  toast(r.ok ? 'Back on your fronts' : 'Could not restore'); loadArchive(); S.fronts = null;
}

// ── conversations ──
async function loadConversations() { await pget('c', '/api/conversations?limit=30'); rerenderPage(); }
function viewConversations() {
  const c = S.pd.c; if (!c) return '<div class="loading">Loading…</div>';
  const rows = c.conversations || [];
  return `<div style="margin-top:12px"><button type="button" class="btn" onclick="S.chat=[];S.chatSession=null;S.chatReflect=null;openSheet('chat')">New conversation</button></div>` +
    (rows.length ? block('Past conversations', null, rows.map(x => `<button type="button" class="srow" style="width:100%;border:none;background:none;text-align:left;border-bottom:1px solid var(--hair2)" onclick="resumeConversation(${ja(x.id)})"><div style="flex:1 1 auto;min-width:0"><div style="font-size:15px">${esc(x.title || 'Conversation')}</div><div class="label" style="font-size:12px">${esc(x.summary || '')}${x.turnCount ? ' · ' + x.turnCount + ' turns' : ''}</div></div>${icon('chev',14)}</button>`).join('')) : '<div class="empty">No past conversations.</div>');
}
async function resumeConversation(id) {
  const r = await api('/api/conversations/restore?id=' + encodeURIComponent(id), { method: 'POST' });
  S.chatSession = id; S.chatReflect = null;
  S.chat = (r.turns || []).map(t => ({ role: t.role === 'user' ? 'user' : 'al', text: t.content }));
  openSheet('chat');
}

// ── scheduling sessions (people tab) ──
let _schedT = null;
async function loadSched() {
  try { S.sched = await api('/api/schedule/sessions'); } catch (e) { S.sched = null; }
  if (S.tab === 'people' && !S.page) renderView();
  clearTimeout(_schedT);
  if (S.sched && (S.sched.sessions || []).length) _schedT = setTimeout(() => { if (S.tab === 'people' && !S.page && !document.hidden) loadSched(); }, 25000);
}
function viewSched() {
  const ss = (S.sched && S.sched.sessions) || [];
  if (!ss.length) return '';
  return `<div class="section"><div class="label">Scheduling</div><div class="stack">` + ss.map(s => {
    const first = firstName(s.contact_name || 'them');
    let acts = '';
    if (s.state === 'resolving') acts = (s.candidates || []).map((c, i) => `<button type="button" class="btn outline" onclick="schedSay(${ja(String(i + 1))},${ja(s.id)})">${esc(c)}</button>`).join('');
    else if (s.state === 'slots_proposed') acts = `<button type="button" class="btn" onclick="schedSay('propose',${ja(s.id)})">Send to ${esc(first)}</button><button type="button" class="ghost" onclick="schedEdit(${ja(s.id)})">Change</button>`;
    else if (s.state === 'reply_surfaced' || s.state === 'held') acts = `<button type="button" class="btn" onclick="schedSay('yes',${ja(s.id)})">Book it</button><button type="button" class="ghost" onclick="schedEdit(${ja(s.id)})">Change</button>`;
    else if (s.state === 'awaiting_reply') acts = `<span class="label">Watching ${esc(first)}'s thread</span>`;
    return `<article class="card post"><div class="who"><b>${esc(s.contact_name || 'Meeting')}</b></div><div class="meta">${esc(s.stage_label || '')}</div>
      ${s.options ? `<pre class="code" style="white-space:pre-wrap;margin-top:8px">${esc(s.options)}</pre>` : ''}${s.draft ? `<div class="compose" style="margin-top:8px;font-size:14px;white-space:pre-wrap">${esc(s.draft)}</div>` : ''}
      ${s.booked_link ? `<a class="link" href="${esc(s.booked_link)}" target="_blank" rel="noopener">Open the event</a>` : ''}
      <div class="actions" style="flex-wrap:wrap">${acts}<span class="spacer"></span><button type="button" class="ghost" onclick="schedSay('leave it',${ja(s.id)})">Drop it</button></div></article>`;
  }).join('') + '</div></div>';
}
async function schedSay(text, session) {
  try {
    const r = await (await fetch('/api/schedule/say?text=' + encodeURIComponent(text) + '&session=' + encodeURIComponent(session), { method: 'POST', headers: { 'Authorization': 'Bearer ' + S.token } })).json();
    toast(r.error || (r.message || 'Done').split('\n')[0]);
  } catch (e) { toast('Could not reach the scheduler.'); }
  setTimeout(loadSched, 1200);
}
function schedEdit(session) { const t = prompt('What should change? (for example: next week, mornings only, 45 minutes)'); if (t) schedSay(t, session); }

// ── closures waiting for a yes (to-dos tab) ──
async function loadClosures() { try { S.closures = await api('/api/commitment-tracker/pending-closures'); } catch (e) { S.closures = null; } if (S.tab === 'todos' && !S.page) renderView(); }
function viewClosures() {
  const rows = (S.closures && S.closures.pendingClosures) || [];
  if (!rows.length) return '';
  return `<div class="section"><div class="label">Did you finish these? Alfred saw signs you did</div><div class="stack">` + rows.slice(0, 5).map(c =>
    `<article class="card post"><div class="body" style="margin-top:0;font-size:16px">${esc(c.title)}</div><div class="meta">${esc(c.signal || '')} · ${Math.round((c.confidence || 0) * 100)}% sure</div>
      <div class="actions"><button type="button" class="btn outline" onclick="closure(${ja(c.hash)},true)">Yes, done</button><button type="button" class="ghost" onclick="closure(${ja(c.hash)},false)">Still open</button></div></article>`).join('') + '</div></div>';
}
async function closure(hash, yes) {
  const r = await apiSend('/api/commitment-tracker/' + (yes ? 'confirm-closure' : 'reject-closure'), 'POST', { hash });
  toast(r.success ? (yes ? 'Closed' : 'Kept open') : (r.error || 'Could not save')); loadClosures(); refresh();
}

// ── hidden suggestions (to-dos tab) ──
function viewHidden() {
  const hid = (S.todos && S.todos.hidden) || [];
  if (!hid.length) return '';
  return `<button type="button" class="ghost" style="margin-top:8px;padding:0" onclick="S.showHidden=!S.showHidden;renderView()">${hid.length} hidden based on what you dismiss · ${S.showHidden ? 'hide' : 'show'}</button>` +
    (S.showHidden ? `<div class="stack tight">${hid.map(g => `<div class="card post" style="padding:10px 16px"><div style="font-size:15px">${esc(g.title)}</div><div class="label" style="font-size:12px;margin-top:2px">${esc(g.hidden_reason || '')}</div><div class="actions"><button type="button" class="btn outline" onclick="accept(${ja(g.id)})">Restore to my list</button></div></div>`).join('')}</div>` : '');
}

// ── post-meeting capture ──
async function checkCapture(force) {
  try {
    const p = await api('/api/v2/capture/pending');
    if (p.pending && (force || sessionStorage.getItem('alfred_capture_seen') !== p.meeting_id)) {
      sessionStorage.setItem('alfred_capture_seen', p.meeting_id);
      openSheet('capture', p.meeting_id, p);
    }
  } catch (e) {}
}
function sheetCapture(s) {
  return `<div class="label" style="padding-top:6px">Just left</div><div class="serif" style="font-size:24px">${esc(s.data.meeting_title || 'your meeting')}</div>
    <label for="capText" class="label" style="display:block;margin-top:14px">Any follow-ups? One per line is fine. They go to your suggestions.</label>
    <textarea id="capText" class="field" rows="5" data-autofocus placeholder="Send Samir the revised model&#10;Ask Nina for the RBI checklist by Friday"></textarea>
    <div style="margin-top:14px;display:flex;gap:8px"><button type="button" class="btn big" style="flex:1 1 auto" onclick="submitCapture()">Add follow-ups</button><button type="button" class="ghost" onclick="closeSheet()">Nothing</button></div>`;
}
async function submitCapture() {
  const text = document.getElementById('capText').value.trim(); if (!text) return closeSheet();
  const s = S.sheet; closeSheet(); toast('Reading your notes…');
  const r = await post('/api/v2/capture', { text, meeting_id: s.id, meeting_title: s.data.meeting_title });
  toast(r.receipt || 'Saved'); refresh();
}

window.addEventListener('resize', () => { if (S.sheet) renderSheet(); });
boot();
</script>
</body>
</html>
