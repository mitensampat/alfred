<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Alfred — Auth Screen Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --canvas: #f8f9fb;
        --surface: #ffffff;
        --surface-sunken: #f0f2f5;
        --ink: #191c1e;
        --ink-secondary: #57606a;
        --ink-tertiary: #8b949e;
        --ink-faint: #b1bac4;
        --line: #d8dee4;
        --line-strong: #ced5dc;
        --coach: #24292f;
        --coach-dark: #1b1f23;
        --gold: #AF9358;
        --gold-dark: #735b26;
        --danger: #8b2332;
        --font-display: 'Newsreader', Georgia, serif;
        --font-body: 'Public Sans', -apple-system, sans-serif;
        --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-body);
        background: var(--canvas);
        color: var(--ink);
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
    }

    .auth-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 48px 36px;
        text-align: center;
        width: 100%;
        max-width: 360px;
        box-shadow: var(--shadow-md);
    }

    /* Monogram */
    .auth-monogram {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        background: var(--coach);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-monogram span {
        font-family: var(--font-display);
        font-size: 32px;
        color: white;
        font-weight: 400;
    }

    .auth-title {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 400;
        color: var(--ink);
        margin-bottom: 4px;
    }
    .auth-subtitle {
        font-size: 13px;
        color: var(--ink-tertiary);
        margin-bottom: 32px;
        font-style: italic;
    }

    .auth-input {
        width: 100%;
        padding: 14px 16px;
        font-family: var(--font-body);
        font-size: 14px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface-sunken);
        color: var(--ink);
        text-align: center;
        outline: none;
        margin-bottom: 14px;
        letter-spacing: 4px;
        transition: border-color 0.2s;
    }
    .auth-input:focus {
        border-color: var(--gold);
    }
    .auth-input::placeholder {
        letter-spacing: 1px;
        color: var(--ink-faint);
    }

    .auth-button {
        width: 100%;
        padding: 14px;
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 600;
        background: var(--coach);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s;
    }
    .auth-button:hover {
        background: var(--coach-dark);
    }

    .auth-version {
        font-size: 11px;
        color: var(--ink-faint);
        margin-top: 24px;
    }

    /* Gold accent line */
    .auth-accent {
        width: 40px;
        height: 2px;
        background: var(--gold);
        margin: 0 auto 24px;
        border-radius: 1px;
    }
</style>
</head>
<body>

<div class="auth-card">
    <div class="auth-monogram"><span>a</span></div>
    <div class="auth-title">Coach Alfred</div>
    <div class="auth-subtitle">sharpen your genius</div>
    <div class="auth-accent"></div>
    <input type="password" class="auth-input" placeholder="passcode" value="">
    <button class="auth-button">Sign In</button>
    <div class="auth-version">v2.0.7</div>
</div>

</body>
</html>
